[tool.poetry]
name = "swe-agent"
version = "0.1.0"
description = "Automated software engineering agent for bug fixing"
authors = ["itcast <itcast@itcast.cn>"]
readme = "README.md"
packages = [{include = "swe_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
anthropic = "^0.39.0"
docker = "^7.1.0"
pydantic = "^2.10.0"
gitpython = "^3.1.43"
structlog = "^24.4.0"
jsonschema = "^4.23.0"
tree-sitter = "^0.26.0"
tree-sitter-python = "^0.25.0"
tree-sitter-javascript = "^0.25.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-docker = "^3.1.1"
black = "^24.10.0"
ruff = "^0.8.0"
mypy = "^1.13.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=src/swe_agent --cov-report=term-missing"
